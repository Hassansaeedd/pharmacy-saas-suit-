services:
  # CuraRx Backend API — deployed on Render (Python / FastAPI)
  - type: web
    name: curarx-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./curarx.db
      - key: ALLOWED_ORIGINS
        value: https://curarx.vercel.app

