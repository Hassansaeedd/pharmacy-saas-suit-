services:
  # PharmaPulse Backend API — deployed on Render (Python / FastAPI)
  - type: web
    name: pharmapulse-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./pharmapulse.db
      - key: ALLOWED_ORIGINS
        value: https://pharmapulse.vercel.app

